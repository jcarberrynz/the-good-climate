name: Update good news stories

on:
  schedule:
    # Runs at 00:00 UTC every 3rd day.
    - cron: "0 0 */3 * *"
  workflow_dispatch: {}   # lets you trigger a manual refresh from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest stories
        run: python3 scripts/fetch_news.py

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/stories.json; then
            git add data/stories.json
            git commit -m "Auto-update good news stories"
            git push
          else
            echo "No changes to commit."
          fi
